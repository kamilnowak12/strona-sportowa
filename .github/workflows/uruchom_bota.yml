name: Automatyczny Bot Sportowy

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Pobranie kodu strony
      uses: actions/checkout@v3

    - name: Instalacja Pythona
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Uruchomienie bota
      run: python bot.py

    - name: Zapisanie zmian na stronie
      run: |
        git config --global user.name "SportBot"
        git config --global user.email "bot@github.com"
        git add mecze.json
        git commit -m "Aktualizacja meczów przez bota" || exit 0
        git push
